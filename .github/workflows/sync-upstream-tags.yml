name: sync-upstream-tags

# 作用：每天从上游拉取全部 tag，推到本仓库。
# 只需要 tags 时用 --no-tags + 单独推 refs/tags，避免把上游分支覆盖掉你的改动。
# 权限：用内置 GITHUB_TOKEN 的 contents:write，不需要任何个人 token 或 secret。

on:
  schedule:
    - cron: "30 3 * * *"        # UTC 03:30 = 北京时间 11:30
  workflow_dispatch: {}         # 允许在 Actions 页面手动点一次

jobs:
  sync-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉上游全部 tag 并推到本仓库
        env:
          UPSTREAM: newsnext/newsnow
        run: |
          set -euo pipefail
          git init -q repo && cd repo
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add up "https://github.com/${UPSTREAM}.git"
          # 只取 tag 引用及其对象，不动本仓库分支
          git fetch -q --tags up
          before=$(git ls-remote --tags origin 2>/dev/null | wc -l || echo 0)
          git push -q origin 'refs/tags/*:refs/tags/*' || true
          after=$(git ls-remote --tags origin | wc -l)
          echo "同步前 tag 数: $before  同步后: $after"
          git ls-remote --tags origin | sed 's#.*refs/tags/##' | sort | tail -20
        # 若 push 因同名 tag 指向不同而被拒，把上一行改成下面这行（会覆盖已有 tag）：
        # git push -q --force origin 'refs/tags/*:refs/tags/*'
